<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <main class="app login" style="display: flex; flex-direction: column; min-height: 100vh; padding: 20px;">
    
    <!-- Regresar arriba a la izquierda -->
    <a href="verificacion.html" style="display: inline-flex; align-items: center; gap: 8px; color: #0f2a5c; font-weight: 700; text-decoration: none; font-size: 14px; margin-bottom: 28px; align-self: flex-start;">
      <img src="../img/icono-atras.png" alt="" width="18" height="18">
      <span>Regresar</span>
    </a>

    <!-- Logo y título -->
    <div style="text-align: center; margin-bottom: 24px;">
      <img src="../img/logo-uca-space.svg" alt="UCA Space" width="68" style="margin-bottom: 12px;">
      <h1 style="color: #0f2a5c; font-size: 24px; font-weight: 700; margin: 0;">Iniciar sesión</h1>
    </div>

    <!-- Formulario -->
    <form action="filtrar.html" style="display: flex; flex-direction: column; gap: 14px; width: 100%;">
      
      <!-- Correo institucional -->
      <label class="campo" style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px;">
        <img src="../img/icono-correo.svg" alt="" width="20" height="20">
        <input type="email" name="correo" placeholder="Correo institucional" required style="border: none; outline: none; width: 100%; font-size: 14px; background: transparent;">
      </label>

      <!-- Contraseña con ícono de ojo -->
      <label class="campo" style="display: flex; align-items: center; gap: 10px; background: #ffffff; border: 1px solid #cbd5e1; border-radius: 12px; padding: 12px 14px;">
        <img src="../img/icono-candado.svg" alt="" width="20" height="20">
        <input type="password" id="password-login" name="password" placeholder="Contraseña" required style="border: none; outline: none; width: 100%; font-size: 14px; background: transparent;">
        <button type="button" onclick="const p = document.getElementById('password-login'); p.type = p.type === 'password' ? 'text' : 'password';" style="background: none; border: none; padding: 0; cursor: pointer; display: flex;">
          <img src="../img/icono-ojo.svg" alt="Mostrar contraseña" width="20" height="20">
        </button>
      </label>

      <!-- Botón principal Iniciar sesión -->
      <button type="submit" class="boton" style="margin-top: 16px; background: #364B7A; color: #ffffff; border: none; border-radius: 14px; padding: 14px; font-size: 15px; font-weight: 600; cursor: pointer; width: 100%;">
        Iniciar sesión
      </button>
    </form>

    <!-- Enlaces inferiores y botón Crear cuenta -->
    <div style="display: flex; flex-direction: column; align-items: center; gap: 12px; margin-top: 18px; width: 100%;">
      <a href="#" style="color: #2563eb; font-size: 13px; font-weight: 600; text-decoration: none;">
        ¿Olvidaste tu contraseña?
      </a>

      <p style="font-size: 12px; color: #64748b; margin: 4px 0 0 0;">
        ¿No tienes una cuenta?
      </p>

      <a href="crear-cuenta.html" class="boton" style="width: 100%; box-sizing: border-box; background: transparent; color: #334155; border: 1.5px solid #475569; border-radius: 14px; padding: 13px; text-align: center; font-weight: 600; font-size: 15px; text-decoration: none;">
        Crear cuenta
      </a>
    </div>

  </main>
  <script src="../js/main.js"></script>
</body>
</html>
