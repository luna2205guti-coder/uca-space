<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCA Space - Tu campus, más cerca</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilos.css">
  <link rel="stylesheet" href="css/splash.css">
</head>
<body class="splash">
  <main
    id="pantalla-marca"
    class="pantalla-marca"
    role="button"
    tabindex="0"
    aria-label="Continuar en UCA Space"
  >
    <img
      src="img/logo-uca-space.svg"
      alt="Logo UCA Space"
      class="emblema-buho"
    >

    <h1 class="marca-titulo">UCA <span>Space</span></h1>
    <p class="marca-subtitulo">TU CAMPUS, MÁS CERCA</p>
  </main>

  <script>
    // Pantalla a la que avanza al tocar
    const SIGUIENTE_RUTA = 'paginas/iniciar-sesion.html';

    const pantallaMarca = document.getElementById('pantalla-marca');

    function continuar() {
      window.location.href = SIGUIENTE_RUTA;
    }

    pantallaMarca.addEventListener('click', continuar);
    pantallaMarca.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        continuar();
      }
    });
  </script>
</body>
</html>
