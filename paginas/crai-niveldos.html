<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca CRAI - Nivel 2 | UCA Space</title>
  <link rel="stylesheet" href="../css/crai-niveldos.css">
</head>
<body>
  <div class="pantalla-biblioteca">
    <header class="encabezado-biblioteca">
      <button type="button" id="btn-regresar" class="btn-regresar" aria-label="Regresar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="titulo-biblioteca">Biblioteca CRAI</h1>
    </header>

    <main class="contenido-biblioteca">
      <p class="subtitulo-biblioteca">Biblioteca P. Florentino Idoate, S.J.</p>

      <div class="selector-niveles" role="tablist" aria-label="Niveles de la biblioteca">
        <button type="button" class="btn-nivel" data-nivel="1" role="tab" aria-selected="false">Nivel 1</button>
        <button type="button" class="btn-nivel activo" data-nivel="2" role="tab" aria-selected="true">Nivel 2</button>
        <button type="button" class="btn-nivel" data-nivel="3" role="tab" aria-selected="false">Nivel 3</button>
      </div>

      <h2 id="titulo-plano-nivel" class="titulo-plano-nivel">Plano nivel 2</h2>

      <section class="mapa-niveldos" aria-label="Plano de la biblioteca">
        <img
          id="img-plano-biblioteca"
          src="../img/mapa-niveldos.svg"
          data-fallbacks='["img/mapa-niveldos.svg","./mapa-niveldos.svg","../../img/mapa-niveldos.svg","mapa-niveldos.svg"]'
          alt="Plano del Nivel 2 de la Biblioteca CRAI"
          class="imagen-plano-biblioteca"
          onload="this.style.display='block'; document.getElementById('estado-mapa').style.display='none';"
          onerror="(function(img){ var list = JSON.parse(img.dataset.fallbacks||'[]'); var i = Number(img.dataset.idx||0); if(i < list.length){ img.dataset.idx = i+1; img.src = list[i]; } else { img.style.display='none'; var aviso = document.getElementById('estado-mapa'); if(aviso){ aviso.style.display='flex'; aviso.textContent='No se encontró mapa-niveldos.svg en img/.'; } } })(this);"
        >
        <div id="estado-mapa" style="display:none; width:100%; min-height:220px; border:1.5px dashed #2b4c7e; border-radius:12px; padding:16px; text-align:center; align-items:center; justify-content:center; font-size:12.5px; color:#566785; background:rgba(255,255,255,0.7);"></div>
      </section>

      <div class="leyenda-plano" aria-label="Leyenda del plano">
        <span class="item-leyenda-plano">
          <span class="punto-leyenda-plano punto-servicios"></span>
          <span>Servicios</span>
        </span>
        <span class="item-leyenda-plano">
          <span class="cuadro-leyenda-plano cuadro-areas"></span>
          <span>Áreas y salas</span>
        </span>
      </div>

      <section class="tarjeta-info-nivel" aria-label="Información del nivel seleccionado">
        <h3 id="titulo-tarjeta-nivel" class="titulo-tarjeta-nivel">Nivel 2 - Biblioteca UCA</h3>
        <p id="descripcion-tarjeta-nivel" class="descripcion-tarjeta-nivel">
          Selecciona un nivel para explorar sus espacios
        </p>
      </section>
    </main>
  </div>

  <script src="../js/crai-niveldos.js"></script>
</body>
</html>
