<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca CRAI - Nivel 2 | UCA Space</title>
  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background: linear-gradient(180deg, #d7def5 0%, #dee4fa 52%, #d4dbf7 100%);
      display: flex;
      justify-content: center;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #162e57;
    }

    .pantalla-biblioteca {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: linear-gradient(180deg, #f6f8fe 0%, #eef2fc 58%, #cfdcf8 100%);
      display: flex;
      flex-direction: column;
      padding-bottom: 32px;
    }

    .encabezado-biblioteca {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 20px 16px 12px;
    }

    .btn-regresar {
      width: 34px;
      height: 34px;
      border: none;
      background: transparent;
      color: #132954;
      border-radius: 50%;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .btn-regresar:active {
      background: rgba(13, 42, 92, 0.08);
      transform: scale(0.95);
    }

    .titulo-biblioteca {
      margin: 0;
      font-size: 19px;
      font-weight: 800;
      color: #102652;
      letter-spacing: -0.015em;
    }

    .contenido-biblioteca {
      padding: 6px 20px 12px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    .subtitulo-biblioteca {
      width: 100%;
      margin: 4px 0 14px;
      font-size: 13px;
      font-weight: 500;
      color: #566785;
      text-align: left;
    }

    .selector-niveles {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 10px;
      margin-bottom: 18px;
    }

    .btn-nivel {
      border: 1.5px solid #2b4c7e;
      border-radius: 999px;
      padding: 9px 12px;
      background: #f5f7fd;
      color: #2b4c7e;
      font-family: inherit;
      font-size: 13.5px;
      font-weight: 600;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease;
    }

    .btn-nivel.activo {
      background: #142b52;
      border-color: #142b52;
      color: #ffffff;
      font-weight: 700;
    }

    .titulo-plano-nivel {
      margin: 0 0 10px;
      font-size: 14px;
      font-weight: 800;
      color: #132852;
      text-align: center;
    }

    .contenedor-plano {
      width: 100%;
      max-width: 310px;
      min-height: 240px;
      display: flex;
      justify-content: center;
      align-items: center;
      position: relative;
    }

    .plano-vectorial-crai {
      width: 100%;
      max-width: 310px;
      aspect-ratio: 320 / 470;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .plano-vectorial-crai svg {
      width: 100%;
      height: 100%;
      display: block;
    }

    .imagen-plano-biblioteca {
      width: 100%;
      height: auto;
      max-height: 410px;
      object-fit: contain;
      display: none;
      border-radius: 8px;
    }

    .leyenda-plano {
      margin-top: 14px;
      margin-bottom: 16px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 22px;
      font-size: 12.5px;
      color: #4f5f7d;
    }

    .item-leyenda-plano {
      display: inline-flex;
      align-items: center;
      gap: 7px;
    }

    .punto-leyenda-plano {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: #23262d;
      display: inline-block;
    }

    .cuadro-leyenda-plano {
      width: 13px;
      height: 12px;
      border-radius: 2px;
      background: #9ab3e8;
      border: 1px solid #455f94;
      display: inline-block;
    }

    .tarjeta-info-nivel {
      width: 100%;
      background: #ffffff;
      border: 1.5px solid #2b4c7e;
      border-radius: 16px;
      padding: 14px 16px;
      box-shadow: 0 4px 12px rgba(16, 38, 82, 0.06);
    }

    .titulo-tarjeta-nivel {
      margin: 0 0 4px;
      font-size: 14.5px;
      font-weight: 800;
      color: #10254f;
    }

    .descripcion-tarjeta-nivel {
      margin: 0;
      font-size: 12.5px;
      color: #5b6b87;
      line-height: 1.38;
    }
  </style>
</head>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const svgNS = 'http://www.w3.org/2000/svg';

      function poblarMesas(grupoId, xInicial, yInicial) {
        const grupo = document.getElementById(grupoId);
        if (!grupo) return;
        grupo.innerHTML = '';

        const columnas = 3;
        const filas = 6;
        const separacionX = 21;
        const separacionY = 23;
        const tamano = 12;

        for (let f = 0; f < filas; f++) {
          for (let c = 0; c < columnas; c++) {
            const rect = document.createElementNS(svgNS, 'rect');
            rect.setAttribute('x', String(xInicial + c * separacionX));
            rect.setAttribute('y', String(yInicial + f * separacionY));
            rect.setAttribute('width', String(tamano));
            rect.setAttribute('height', String(tamano));
            rect.setAttribute('rx', '1.5');
            grupo.appendChild(rect);
          }
        }
      }

      poblarMesas('mesas-izquierda', 50, 158);
      poblarMesas('mesas-derecha', 212, 158);

      const btnRegresar = document.getElementById('btn-regresar');
      if (btnRegresar) {
        btnRegresar.addEventListener('click', () => {
          if (window.history.length > 1) {
            window.history.back();
          } else {
            window.location.href = 'bienvenido.html';
          }
        });
      }

      const configNiveles = {
        1: {
          tituloPlano: 'Plano nivel 1',
          tituloTarjeta: 'Nivel 1 - Biblioteca UCA',
          descripcion: 'Selecciona un nivel para explorar sus espacios',
          usarVectorNivel2: false,
          imgSrc: '../img/mapa-primernivel.png'
        },
        2: {
          tituloPlano: 'Plano nivel 2',
          tituloTarjeta: 'Nivel 2 - Biblioteca UCA',
          descripcion: 'Selecciona un nivel para explorar sus espacios',
          usarVectorNivel2: true,
          imgSrc: ''
        },
        3: {
          tituloPlano: 'Plano nivel 3',
          tituloTarjeta: 'Nivel 3 - Biblioteca UCA',
          descripcion: 'Selecciona un nivel para explorar sus espacios',
          usarVectorNivel2: false,
          imgSrc: '../img/mapa-tercernivel.png'
        }
      };

      const botonesNivel = Array.from(document.querySelectorAll('.btn-nivel'));
      const tituloPlanoEl = document.getElementById('titulo-plano-nivel');
      const tituloTarjetaEl = document.getElementById('titulo-tarjeta-nivel');
      const descripcionTarjetaEl = document.getElementById('descripcion-tarjeta-nivel');
      const planoVectorEl = document.getElementById('plano-nivel-2');
      const imgNivelEl = document.getElementById('img-plano-nivel');

      function actualizarNivel(nivelNum) {
        const cfg = configNiveles[nivelNum] || configNiveles[2];

        botonesNivel.forEach((btn) => {
          const activo = Number(btn.dataset.nivel) === Number(nivelNum);
          btn.classList.toggle('activo', activo);
          btn.setAttribute('aria-selected', String(activo));
        });

        if (tituloPlanoEl) tituloPlanoEl.textContent = cfg.tituloPlano;
        if (tituloTarjetaEl) tituloTarjetaEl.textContent = cfg.tituloTarjeta;
        if (descripcionTarjetaEl) descripcionTarjetaEl.textContent = cfg.descripcion;

        if (cfg.usarVectorNivel2) {
          if (planoVectorEl) planoVectorEl.style.display = 'flex';
          if (imgNivelEl) imgNivelEl.style.display = 'none';
        } else {
          if (planoVectorEl) planoVectorEl.style.display = 'none';
          if (imgNivelEl) {
            imgNivelEl.style.display = 'block';
            imgNivelEl.alt = `${cfg.tituloPlano} de la Biblioteca CRAI`;
            imgNivelEl.src = cfg.imgSrc;
          }
        }
      }

      botonesNivel.forEach((btn) => {
        btn.addEventListener('click', () => {
          actualizarNivel(Number(btn.dataset.nivel));
        });
      });

      actualizarNivel(2);
    });
  </script>
