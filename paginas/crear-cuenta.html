<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Crear cuenta - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
</head>
<body>
  <main class="app registro">
    <header class="registro__encabezado">
      <a href="../index.html" class="registro__regresar">
        <img src="../img/icono-atras.png" alt="" width="20" height="20">
        <span>Regresar</span>
      </a>
    </header>

    <div class="registro__logo" aria-hidden="true">
      <!-- Aquí irá tu logo o búho cuando agregues las imágenes -->
    </div>

    <p class="registro__subtitulo">Regístrate con tu correo institucional</p>

    <form action="verificacion.html" class="registro__form">
      <div class="campo">
        <label for="nombre">Nombre Completo</label>
        <input type="text" id="nombre" name="nombre" placeholder="Escribe tu nombre" required>
      </div>

      <div class="campo">
        <label for="correo">Correo Institucional</label>
        <input type="email" id="correo" name="correo" placeholder="Escribe tu correo" required>
      </div>

      <div class="campo">
        <label for="clave">Contraseña</label>
        <input type="password" id="clave" name="clave" placeholder="Escribe tu contraseña" required>
      </div>

      <div class="campo">
        <label for="confirmar-clave">Confirma tu contraseña</label>
        <input type="password" id="confirmar-clave" name="confirmar-clave" placeholder="Repite tu contraseña" required>
      </div>

      <label class="casilla registro__terminos">
        <input type="checkbox" name="terminos" required>
        <span>Acepto los términos y condiciones</span>
      </label>

      <button type="submit" class="boton boton--oscuro">Crear cuenta</button>
    </form>
  </main>

  <script src="../js/main.js"></script>
</body>
</html>
