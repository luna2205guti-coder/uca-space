<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Mapa del campus - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100dvh;
      background: linear-gradient(180deg, #d7def5 0%, #dee4fa 52%, #d4dbf7 100%);
      display: flex;
      justify-content: center;
      font-family: inherit;
      color: #162e57;
    }

    .pantalla-mapa {
      width: 100%;
      max-width: 430px;
      min-height: 100dvh;
      background: linear-gradient(180deg, #f4f6fd 0%, #eef2fc 42%, #dce3fb 100%);
      display: flex;
      flex-direction: column;
      position: relative;
      padding-bottom: 92px;
      overflow-x: hidden;
    }

    .encabezado-mapa {
      display: flex;
      align-items: center;
      gap: 14px;
      padding: 18px 18px 10px;
      background: #f5f7fe;
    }

    .btn-regresar {
      width: 36px;
      height: 36px;
      border: none;
      border-radius: 10px;
      background: transparent;
      color: #0d2a5c;
      display: grid;
      place-items: center;
      cursor: pointer;
      padding: 0;
    }

    .btn-regresar:active {
      background: rgba(13, 42, 92, 0.08);
    }

    .titulo-mapa {
      margin: 0;
      font-size: 20px;
      font-weight: 800;
      color: #0d2a5c;
      letter-spacing: -0.01em;
    }

    .barra-controles {
      background: #f5f7fe;
      padding: 4px 18px 10px;
    }

    .chips-zonas {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }

    .chips-zonas::-webkit-scrollbar {
      display: none;
    }

    .chip-zona {
      border: 1px solid #d7def2;
      background: #ffffff;
      color: #1d2d4a;
      border-radius: 999px;
      padding: 7px 15px;
      font-family: inherit;
      font-size: 13px;
      font-weight: 500;
      white-space: nowrap;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .chip-zona.activa {
      background: #0d2a5c;
      border-color: #0d2a5c;
      color: #ffffff;
      font-weight: 600;
    }

    .leyenda-estados {
      display: flex;
      align-items: center;
      gap: 16px;
      font-size: 12px;
      color: #5b6880;
    }

    .item-leyenda {
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .punto-estado {
      width: 10px;
      height: 10px;
      border-radius: 50%;
      display: inline-block;
    }

    .punto-libre {
      background: #0d7a4a;
    }

    .punto-ocupada {
      background: #b8293d;
    }

    .punto-reporte {
      background: #ffffff;
      border: 2.5px solid #f2b705;
    }

    .lienzo-mapa {
      position: relative;
      width: 100%;
      height: 455px;
      background: #77d429;
      overflow: hidden;
      border-top: 1px solid #e3e8f6;
      border-bottom: 1px solid #dfe5f5;
    }

    .mapa-escena {
      width: 100%;
      height: 100%;
      transform-origin: center center;
      transition: transform 0.22s ease;
    }

    .espacio-clic {
      cursor: pointer;
      transition: opacity 0.15s ease, filter 0.15s ease;
    }

    .espacio-clic:hover {
      filter: brightness(1.06);
    }

    .espacio-seleccionado {
      stroke: #0d2a5c !important;
      stroke-width: 3 !important;
    }

    .controles-zoom {
      position: absolute;
      right: 12px;
      bottom: 12px;
      display: flex;
      flex-direction: column;
      background: #ffffff;
      border: 1px solid #c9d1e3;
      border-radius: 8px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(13, 42, 92, 0.12);
      z-index: 5;
    }

    .btn-zoom {
      width: 34px;
      height: 34px;
      border: none;
      background: #ffffff;
      color: #4a5568;
      font-size: 20px;
      line-height: 1;
      display: grid;
      place-items: center;
      cursor: pointer;
    }

    .btn-zoom + .btn-zoom {
      border-top: 1px solid #d5dce9;
    }

    .btn-zoom:active {
      background: #edf1fa;
    }

    /* Tarjeta inferior de ubicación */
    .seccion-ubicacion {
      padding: 18px 18px 8px;
    }

    .tarjeta-ubicacion {
      width: 100%;
      background: #f4f6fe;
      border: 1px solid #b5c3e0;
      border-radius: 16px;
      padding: 15px 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      text-align: left;
      cursor: pointer;
      box-shadow: 0 4px 14px rgba(13, 42, 92, 0.05);
    }

    .tarjeta-ubicacion-izq {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    .ubicacion-titulo {
      margin: 0;
      font-size: 14.5px;
      font-weight: 700;
      color: #162e57;
    }

    .ubicacion-sub {
      margin: 3px 0 0;
      font-size: 12.5px;
      color: #6b768c;
    }

    /* Panel flotante de detalle de espacio */
    .ficha-espacio {
      position: fixed;
      left: 50%;
      bottom: 84px;
      transform: translate(-50%, 24px);
      width: calc(100% - 32px);
      max-width: 398px;
      background: #ffffff;
      border: 1px solid #c7d3ec;
      border-radius: 20px;
      padding: 16px;
      box-shadow: 0 12px 28px rgba(13, 42, 92, 0.18);
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s ease, transform 0.22s ease;
      z-index: 20;
    }

    .ficha-espacio.visible {
      opacity: 1;
      pointer-events: auto;
      transform: translate(-50%, 0);
    }

    .ficha-cabecera {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 6px;
    }

    .ficha-nombre {
      margin: 0;
      font-size: 16px;
      font-weight: 800;
      color: #0d2a5c;
    }

    .insignia-estado {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 10px;
      border-radius: 999px;
      font-size: 11.5px;
      font-weight: 700;
    }

    .estado-libre {
      background: #e6f5ee;
      color: #0d7a4a;
    }

    .estado-ocupada {
      background: #fdebec;
      color: #b8293d;
    }

    .estado-reporte {
      background: #fff8e1;
      color: #9a6b00;
    }

    .ficha-descripcion {
      margin: 0 0 14px;
      font-size: 13px;
      color: #52607a;
      line-height: 1.4;
    }

    .ficha-acciones {
      display: flex;
      gap: 8px;
    }

    .btn-ficha-primario {
      flex: 1;
      border: none;
      border-radius: 12px;
      padding: 10px 14px;
      background: #0d2a5c;
      color: #ffffff;
      font-family: inherit;
      font-size: 13px;
      font-weight: 700;
      cursor: pointer;
    }

    .btn-ficha-secundario {
      border: 1px solid #cfd8eb;
      border-radius: 12px;
      padding: 10px 14px;
      background: #f5f7fe;
      color: #0d2a5c;
      font-family: inherit;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
    }

    /* Barra inferior de navegación */
    .barra-inferior {
      position: fixed;
      bottom: 12px;
      left: 50%;
      transform: translateX(-50%);
      width: calc(100% - 28px);
      max-width: 402px;
      background: #f7f9ff;
      border-radius: 26px;
      padding: 7px 10px;
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      align-items: center;
      gap: 4px;
      box-shadow: 0 8px 24px rgba(13, 42, 92, 0.14);
      z-index: 15;
    }

    .nav-item {
      border: none;
      background: transparent;
      color: #2f6be0;
      border-radius: 22px;
      padding: 8px 6px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      font-family: inherit;
      font-size: 11px;
      font-weight: 600;
      cursor: pointer;
      text-decoration: none;
    }

    .nav-item.activo {
      background: linear-gradient(180deg, #1b3f82 0%, #0d2a5c 100%);
      color: #ffffff;
      box-shadow: 0 4px 12px rgba(13, 42, 92, 0.25);
    }
  </style>
</head>
<body>

  <script>
    const RUTA_DETALLE_ESPACIO = 'resultados.html';
    const origenAnterior = sessionStorage.getItem('uca_space_origen_mapa') || 'actividades.html';

    document.getElementById('btn-volver-mapa').addEventListener('click', () => {
      window.location.href = origenAnterior;
    });

    const datosEspacios = {
      biblioteca: {
        nombre: 'Biblioteca',
        estado: 'Libre',
        claseEstado: 'estado-libre',
        descripcion: 'Mesas de estudio silencioso y salas grupales con buena disponibilidad.',
        destino: RUTA_DETALLE_ESPACIO
      },
      cafeteria: {
        nombre: 'Cafetería',
        estado: 'Ocupada',
        claseEstado: 'estado-ocupada',
        descripcion: 'Alta afluencia en horas pico; mesas cercanas en áreas laterales.',
        destino: RUTA_DETALLE_ESPACIO
      },
      bosque: {
        nombre: 'Bosque',
        estado: 'Libre',
        claseEstado: 'estado-libre',
        descripcion: 'Mesas al aire libre y sombra natural para descansar o estudiar.',
        destino: RUTA_DETALLE_ESPACIO
      },
      reporte: {
        nombre: 'Área con reporte',
        estado: 'Con reporte',
        claseEstado: 'estado-reporte',
        descripcion: 'Reporte activo en esta zona (iluminación o mantenimiento en revisión).',
        destino: RUTA_DETALLE_ESPACIO
      },
      'aulas-centrales': {
        nombre: 'Aulas y áreas centrales',
        estado: 'Libre',
        claseEstado: 'estado-libre',
        descripcion: 'Pasillos y espacios cercanos con acceso rápido a zonas comunes.',
        destino: RUTA_DETALLE_ESPACIO
      },
      'aulas-este': {
        nombre: 'Edificios sector este',
        estado: 'Ocupada',
        claseEstado: 'estado-ocupada',
        descripcion: 'Zona académica con actividad de clases en curso.',
        destino: RUTA_DETALLE_ESPACIO
      },
      'edificios-sur': {
        nombre: 'Edificios sector sur',
        estado: 'Libre',
        claseEstado: 'estado-libre',
        descripcion: 'Espacios disponibles en los alrededores del sector sur.',
        destino: RUTA_DETALLE_ESPACIO
      }
    };

    let espacioActualKey = null;
    const fichaEl = document.getElementById('ficha-espacio');
    const fichaNombre = document.getElementById('ficha-nombre');
    const fichaEstado = document.getElementById('ficha-estado');
    const fichaDescripcion = document.getElementById('ficha-descripcion');
    const btnFichaVer = document.getElementById('btn-ficha-ver');
    const btnFichaCerrar = document.getElementById('btn-ficha-cerrar');

    function abrirFichaEspacio(key) {
      const info = datosEspacios[key];
      if (!info) return;

      espacioActualKey = key;
      document.querySelectorAll('.espacio-clic').forEach((el) => {
        el.classList.toggle('espacio-seleccionado', el.dataset.espacio === key);
      });

      fichaNombre.textContent = info.nombre;
      fichaEstado.textContent = info.estado;
      fichaEstado.className = `insignia-estado ${info.claseEstado}`;
      fichaDescripcion.textContent = info.descripcion;
      fichaEl.classList.add('visible');
    }

    function cerrarFichaEspacio() {
      espacioActualKey = null;
      document.querySelectorAll('.espacio-clic').forEach((el) => {
        el.classList.remove('espacio-seleccionado');
      });
      fichaEl.classList.remove('visible');
    }

    document.querySelectorAll('.espacio-clic').forEach((el) => {
      el.addEventListener('click', (e) => {
        e.stopPropagation();
        abrirFichaEspacio(el.dataset.espacio);
      });
    });

    btnFichaCerrar.addEventListener('click', cerrarFichaEspacio);

    btnFichaVer.addEventListener('click', () => {
      if (!espacioActualKey) return;
      const info = datosEspacios[espacioActualKey];
      sessionStorage.setItem('uca_space_origen', 'mapa.html');
      sessionStorage.setItem('uca_space_espacio_seleccionado', JSON.stringify({
        id: espacioActualKey,
        nombre: info.nombre,
        estado: info.estado
      }));
      window.location.href = info.destino;
    });

    // Zoom
    let escalaMapa = 1;
    const mapaEscena = document.getElementById('mapa-escena');

    function actualizarZoom(delta) {
      escalaMapa = Math.min(1.6, Math.max(1, Number((escalaMapa + delta).toFixed(2))));
      mapaEscena.style.transform = `scale(${escalaMapa})`;
    }

    document.getElementById('btn-zoom-mas').addEventListener('click', () => actualizarZoom(0.2));
    document.getElementById('btn-zoom-menos').addEventListener('click', () => actualizarZoom(-0.2));

    // Chips superiores
    const chips = document.querySelectorAll('.chip-zona');
    const subUbicacion = document.getElementById('texto-ubicacion-sub');

    const vistasZona = {
      biblioteca: { escala: 1.3, texto: 'Enfocando Biblioteca · Zonas de estudio disponibles' },
      cafeteria: { escala: 1.3, texto: 'Enfocando Cafetería · Mesas y áreas cercanas' },
      bosque: { escala: 1.25, texto: 'Enfocando Bosque · Áreas verdes y mesas al aire libre' }
    };

    chips.forEach((chip) => {
      chip.addEventListener('click', () => {
        const key = chip.dataset.zona;
        const yaActiva = chip.classList.contains('activa');
        chips.forEach((c) => c.classList.remove('activa'));

        if (yaActiva) {
          escalaMapa = 1;
          mapaEscena.style.transform = 'scale(1)';
          subUbicacion.textContent = 'Ubicación aproximada dentro del campus';
          cerrarFichaEspacio();
          return;
        }

        chip.classList.add('activa');
        const config = vistasZona[key];
        if (config) {
          escalaMapa = config.escala;
          mapaEscena.style.transform = `scale(${escalaMapa})`;
          subUbicacion.textContent = config.texto;
        }
        abrirFichaEspacio(key);
      });
    });

    document.getElementById('btn-ubicacion').addEventListener('click', () => {
      escalaMapa = 1.15;
      mapaEscena.style.transform = `scale(${escalaMapa})`;
      subUbicacion.textContent = 'Ubicación actualizada · Campus UCA';
    });

    document.querySelectorAll('.barra-inferior .nav-item').forEach((btn) => {
      btn.addEventListener('click', () => {
        const destino = btn.dataset.destino;
        if (destino && destino !== 'mapa.html') {
          sessionStorage.setItem('uca_space_origen', 'mapa.html');
          window.location.href = destino;
        }
      });
    });
  </script>
</body>
</html>
