<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Privacidad y condiciones - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/privacidad-condiciones.css">
</head>
<body>
  <div class="pantalla-privacidad-condiciones">
    <!-- Encabezado -->
    <header class="encabezado-privacidad">
      <button type="button" id="btn-regresar" class="btn-regresar" aria-label="Regresar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="titulo-privacidad">Privacidad y condiciones</h1>
    </header>

    <main class="contenido-privacidad">
      <p class="intro-privacidad">
        Conoce cómo cuidamos tu información y las reglas para utilizar UCA Space.
      </p>

      <!-- Tarjeta principal -->
      <section class="tarjeta-aviso" aria-label="Aviso de privacidad">
        <h2 class="tarjeta-aviso-titulo">Tu privacidad importa</h2>
        <p class="tarjeta-aviso-texto">
          Revisa la información antes de continuar utilizando la aplicación.
        </p>
      </section>

      <!-- Documentos -->
      <section class="bloque-seccion" aria-labelledby="titulo-documentos">
        <h2 id="titulo-documentos" class="subtitulo-seccion">Documentos</h2>

        <div class="lista-documentos">
          <button type="button" class="item-documento" data-doc="privacidad">
            <span class="icono-doc-izq" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d2a5c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </span>
            <span class="texto-documento">
              <strong class="doc-titulo">Política de privacidad</strong>
              <span class="doc-desc">Cómo se recopilan y utilizan tus datos.</span>
            </span>
            <span class="flecha-der" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d2a5c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </button>

          <button type="button" class="item-documento" data-doc="terminos">
            <span class="icono-doc-izq" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d2a5c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                <polyline points="14 2 14 8 20 8"></polyline>
              </svg>
            </span>
            <span class="texto-documento">
              <strong class="doc-titulo">Términos y condiciones</strong>
              <span class="doc-desc">Reglas de uso de UCA Space.</span>
            </span>
            <span class="flecha-der" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d2a5c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </button>

          <button type="button" class="item-documento" data-doc="permisos">
            <span class="icono-doc-izq" aria-hidden="true">
              <svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="#0d2a5c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <circle cx="12" cy="12" r="9"></circle>
                <line x1="12" y1="8" x2="12" y2="16"></line>
                <line x1="8" y1="12" x2="16" y2="12"></line>
              </svg>
            </span>
            <span class="texto-documento">
              <strong class="doc-titulo">Permisos de la aplicación</strong>
              <span class="doc-desc">Consulta los accesos solicitados.</span>
            </span>
            <span class="flecha-der" aria-hidden="true">
              <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="#0d2a5c" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
                <line x1="5" y1="12" x2="19" y2="12"></line>
                <polyline points="12 5 19 12 12 19"></polyline>
              </svg>
            </span>
          </button>
        </div>
      </section>

      <!-- Tus datos -->
      <section class="bloque-seccion" aria-labelledby="titulo-datos">
        <h2 id="titulo-datos" class="subtitulo-seccion">Tus datos</h2>

        <button type="button" id="btn-opciones-cuenta" class="tarjeta-datos">
          <span class="datos-texto">
            Puedes solicitar información sobre tus datos o pedir ayuda para actualizar tu cuenta.
          </span>
          <strong class="datos-accion">Consultar opciones de cuenta</strong>
        </button>
      </section>
    </main>

    <!-- Modal / detalle simple al tocar un documento u opción -->
    <div id="modal-detalle" class="modal-detalle" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-caja">
        <h3 id="modal-titulo" class="modal-titulo"></h3>
        <p id="modal-cuerpo" class="modal-cuerpo"></p>
        <button type="button" id="btn-cerrar-modal" class="btn-modal-cerrar">Entendido</button>
      </div>
    </div>

    <!-- Barra inferior de navegación -->
    <nav class="barra-inferior" aria-label="Navegación principal">
      <button type="button" class="nav-item" data-destino="pantalla-inicio.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"></path>
        </svg>
        <span>Inicio</span>
      </button>

      <button type="button" class="nav-item" data-destino="mapa.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span>Mapa</span>
      </button>

      <button type="button" class="nav-item" data-destino="opiniones-calificaciones.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Guardados</span>
      </button>

      <button type="button" class="nav-item activo" data-destino="perfil.html" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <script src="../js/privacidad.js"></script>
</body>
</html>
