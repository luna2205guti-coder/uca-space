<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biblioteca UCA - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/crai-nivel2.css">
</head>
<body class="crai">
  <main class="crai__contenido">

    <header class="crai__cabecera">
      <a href="mapa.html" aria-label="Volver">
        <img src="../img/icono-atras.png" alt="" width="24" height="24">
      </a>
      <h1>Biblioteca UCA</h1>
    </header>

    <p class="crai__nombre">Biblioteca P. Florentino Idoate, S.J.</p>

    <div class="niveles" role="tablist">
      <button class="niveles__boton" type="button" data-nivel="1" role="tab">Nivel 1</button>
      <button class="niveles__boton niveles__boton--activo" type="button" data-nivel="2" role="tab">Nivel 2</button>
      <button class="niveles__boton" type="button" data-nivel="3" role="tab">Nivel 3</button>
    </div>

    <h2 class="crai__plano-titulo" id="titulo-plano">Plano nivel 2</h2>

    <img class="crai__plano" id="imagen-plano" src="../img/plano-nivel-2.png" alt="Plano del nivel 2 de la biblioteca">

    <ul class="leyenda">
      <li><span class="leyenda__punto leyenda__punto--servicios"></span>Servicios</li>
      <li><span class="leyenda__punto leyenda__punto--salas"></span>Áreas y salas</li>
    </ul>

    <section class="crai__info">
      <h3 id="info-titulo">Nivel 2 - Biblioteca UCA</h3>
      <p>Selecciona un nivel para explorar sus espacios</p>
    </section>

  </main>
  <script src="../js/crai-nivel2.js"></script>
</body>
</html>
