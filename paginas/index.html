<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>UCA Space</title>
  <link rel="stylesheet" href="css/variables.css">
  <link rel="stylesheet" href="css/estilos.css">
  <style>
    * {
      box-sizing: border-box;
    }

    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background: #0d2a5c;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      font-family: inherit;
    }

    .pantalla-splash {
      width: 100%;
      max-width: 430px;
      height: 100%;
      min-height: 100dvh;
      background: #0d2a5c;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 28px;
      cursor: pointer;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    .logo-splash {
      width: 100%;
      max-width: 340px;
      height: auto;
      display: block;
      animation: entradaLogo 0.7s cubic-bezier(0.22, 1, 0.36, 1) both;
    }

    @keyframes entradaLogo {
      from {
        opacity: 0;
        transform: scale(0.92);
      }
      to {
        opacity: 1;
        transform: scale(1);
      }
    }
  </style>
</head>
<body>
  <main
    id="pantalla-splash"
    class="pantalla-splash"
    role="button"
    tabindex="0"
    aria-label="Entrar a UCA Space"
  >
    <!-- Si quieres usar tu propia imagen exportada de Figma, descomenta la línea de abajo y borra el <svg> -->
    <!-- <img src="img/logo-buho-corazon.png" alt="UCA Space" class="logo-splash"> -->

    <svg
      class="logo-splash"
      viewBox="0 0 360 320"
      fill="none"
      xmlns="http://www.w3.org/2000/svg"
      aria-label="Logo UCA Space"
    >
      <!-- Silueta de corazón exterior -->
      <path
        d="M180 282C180 282 32 192 32 106C32 61 67 28 110 28C142 28 168 46 180 71C192 46 218 28 250 28C293 28 328 61 328 106C328 192 180 282 180 282Z"
        stroke="#ffffff"
        stroke-width="26"
        stroke-linecap="round"
        stroke-linejoin="round"
      />

      <!-- Aro izquierdo de lentes -->
      <circle
        cx="124"
        cy="128"
        r="46"
        stroke="#ffffff"
        stroke-width="22"
      />

      <!-- Aro derecho de lentes -->
      <circle
        cx="236"
        cy="128"
        r="46"
        stroke="#ffffff"
        stroke-width="22"
      />

      <!-- Puente de los lentes -->
      <line
        x1="170"
        y1="126"
        x2="190"
        y2="126"
        stroke="#ffffff"
        stroke-width="18"
        stroke-linecap="round"
      />

      <!-- Pico central -->
      <path
        d="M161 132H199L192 186C190.5 196.5 185.5 202 180 202C174.5 202 169.5 196.5 168 186L161 132Z"
        stroke="#ffffff"
        stroke-width="18"
        stroke-linecap="round"
        stroke-linejoin="round"
      />
    </svg>
  </main>

  <script>
    // Cambia esta ruta por el archivo de tu segunda pantalla inicial cuando la tengas lista
    const SIGUIENTE_PANTALLA = '../index.html';
    const TIEMPO_ESPERA_MS = 1800;

    let navegando = false;

    function irASiguientePantalla() {
      if (navegando) return;
      navegando = true;
      window.location.href = SIGUIENTE_PANTALLA;
    }

    const splashEl = document.getElementById('pantalla-splash');
    splashEl.addEventListener('click', irASiguientePantalla);
    splashEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        irASiguientePantalla();
      }
    });

    const temporizador = setTimeout(irASiguientePantalla, TIEMPO_ESPERA_MS);
    window.addEventListener('pagehide', () => clearTimeout(temporizador));
  </script>
</body>
</html>
