<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escribir una opinión - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/escribir-opinion.css">
</head>
<body>
  <div class="pantalla-opinion">
    <header class="encabezado-opinion">
      <button type="button" id="btn-regresar" class="btn-regresar" aria-label="Regresar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="titulo-opinion">Escribir una opinión</h1>
    </header>

    <main class="contenido-opinion">
      <section class="cabecera-espacio" aria-label="Espacio evaluado">
        <p class="etiqueta-opinando">Estás opinando sobre</p>
        <h2 id="nombre-espacio" class="nombre-espacio">Área de descanso</h2>
      </section>

      <form id="form-opinion" class="formulario-opinion" novalidate>
        <!-- Calificación de estrellas -->
        <div class="bloque-estrellas">
          <label id="label-calificacion" class="pregunta-calificacion">
            ¿Cómo calificas este espacio?
          </label>

          <div id="grupo-estrellas" class="grupo-estrellas" role="radiogroup" aria-labelledby="label-calificacion">
            <button type="button" class="btn-estrella" data-valor="1" role="radio" aria-checked="false" aria-label="1 estrella">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>

            <button type="button" class="btn-estrella" data-valor="2" role="radio" aria-checked="false" aria-label="2 estrellas">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>

            <button type="button" class="btn-estrella" data-valor="3" role="radio" aria-checked="false" aria-label="3 estrellas">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>

            <button type="button" class="btn-estrella" data-valor="4" role="radio" aria-checked="false" aria-label="4 estrellas">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>

            <button type="button" class="btn-estrella" data-valor="5" role="radio" aria-checked="false" aria-label="5 estrellas">
              <svg width="42" height="42" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                <polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"></polygon>
              </svg>
            </button>
          </div>

          <p id="texto-calificacion" class="texto-calificacion">Selecciona de 1 a 5 estrellas</p>
        </div>

        <!-- Experiencia -->
        <div class="grupo-experiencia">
          <label for="textarea-experiencia" class="etiqueta-experiencia">
            Cuéntanos tu experiencia
          </label>
          <textarea
            id="textarea-experiencia"
            class="caja-experiencia"
            rows="6"
            placeholder="Comparte detalles sobre ruido, iluminación, disponibilidad de asientos o comodidad..."
          ></textarea>
        </div>

        <!-- Nota informativa -->
        <div class="nota-ayuda">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="12" r="10"></circle>
            <line x1="12" y1="16" x2="12" y2="12"></line>
            <line x1="12" y1="8" x2="12.01" y2="8"></line>
          </svg>
          <span>Tu opinión ayudará a otros estudiantes</span>
        </div>

        <p id="mensaje-error-opinion" class="mensaje-error" role="alert" aria-live="polite"></p>

        <button type="submit" id="btn-publicar-opinion" class="btn-publicar">
          Publicar
        </button>
      </form>
    </main>

    <!-- Modal de confirmación -->
    <div id="modal-opinion" class="modal-opinion" role="dialog" aria-modal="true" aria-hidden="true">
      <div class="modal-caja">
        <h2 class="modal-titulo">Opinión publicada</h2>
        <p id="modal-opinion-texto" class="modal-texto">
          Tu valoración se ha guardado correctamente en UCA Space.
        </p>
        <button type="button" id="btn-aceptar-opinion" class="btn-modal-aceptar">Aceptar</button>
      </div>
    </div>

    <!-- Barra inferior -->
    <nav class="barra-inferior" aria-label="Navegación principal">
      <button type="button" class="nav-item" data-destino="bienvenida.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 10.5L12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1v-9.5z"></path>
        </svg>
        <span>Inicio</span>
      </button>

      <button type="button" class="nav-item" data-destino="mapa.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <polygon points="1 6 1 22 8 18 16 22 23 18 23 2 16 6 8 2 1 6"></polygon>
          <line x1="8" y1="2" x2="8" y2="18"></line>
          <line x1="16" y1="6" x2="16" y2="22"></line>
        </svg>
        <span>Mapa</span>
      </button>

      <button type="button" class="nav-item activo" data-destino="guardados.html" aria-current="page">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"></path>
        </svg>
        <span>Guardados</span>
      </button>

      <button type="button" class="nav-item" data-destino="perfil.html">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.1" stroke-linecap="round" stroke-linejoin="round">
          <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
          <circle cx="12" cy="7" r="4"></circle>
        </svg>
        <span>Perfil</span>
      </button>
    </nav>
  </div>

  <script src="../js/escribir-opinion.js"></script>
</body>
</html>
