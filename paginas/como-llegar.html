<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo llegar - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/como-llegar.css">
</head>
<body>
  <div class="pantalla-como-llegar">
    <header class="encabezado-ruta">
      <button type="button" id="btn-regresar" class="btn-regresar" aria-label="Regresar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="titulo-ruta">Cómo llegar</h1>
    </header>

    <main class="contenido-ruta">
      <!-- Mapa con imagen mapa-comollegar.png (sin textos duplicados) -->
      <section class="contenedor-mapa" aria-label="Mapa de ruta en el campus">
        <img
          id="img-mapa-campus"
          src="../img/mapa-comollegar.png"
          data-fallbacks='["./mapa-comollegar.png","../imagenes/mapa-comollegar.png","../assets/mapa-comollegar.png","../mapa-comollegar.png"]'
          alt="Mapa de ruta en el campus desde Tú hasta Mesa B5 Libre en la Biblioteca"
          class="imagen-mapa-campus"
          onerror="(function(img){ var list = JSON.parse(img.dataset.fallbacks||'[]'); var i = Number(img.dataset.idx||0); if(i < list.length){ img.dataset.idx = i+1; img.src = list[i]; } })(this);"
        >

        <!-- Zonas clicables transparentes sobre B3, B4 y B5 -->
        <button type="button" class="pin-mesa pin-b3" data-mesa="B3" aria-label="Seleccionar Mesa B3"></button>
        <button type="button" class="pin-mesa pin-b4" data-mesa="B4" aria-label="Seleccionar Mesa B4"></button>
        <button type="button" class="pin-mesa pin-b5 activo" data-mesa="B5" aria-label="Seleccionar Mesa B5"></button>
      </section>

      <!-- Información del destino y ruta -->
      <section class="info-destino" aria-label="Detalles de la ruta">
        <h2 id="titulo-destino" class="titulo-destino">Destino: Mesa B5 · Biblioteca</h2>

        <div class="barra-resumen-ruta">
          <span class="etiqueta-esquematica">Ruta esquemática</span>
          <span id="dato-distancia-tiempo" class="dato-distancia-tiempo">≈ 152 m · 2 min a pie</span>
        </div>

        <button type="button" id="btn-toggle-indicaciones" class="btn-indicaciones" aria-expanded="true">
          Ocultar indicaciones
        </button>

        <ol id="lista-indicaciones" class="lista-indicaciones">
          <li>Sal desde tu ubicación, marcada como «Tú».</li>
          <li>Sigue la línea azul del mapa.</li>
          <li id="paso-zona">Llegarás a la zona Biblioteca.</li>
          <li id="paso-mesa">Busca la mesa B5.</li>
        </ol>

        <p class="nota-aproximada">
          La ruta es aproximada. Confirma el camino en el campus.
        </p>
      </section>
    </main>
  </div>

  <script src="../js/como-llegar.js"></script>
</body>
</html>
