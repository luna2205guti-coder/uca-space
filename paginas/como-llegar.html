<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cómo llegar - UCA Space</title>
  <link rel="stylesheet" href="../css/variables.css">
  <link rel="stylesheet" href="../css/estilos.css">
  <link rel="stylesheet" href="../css/como-llegar.css">
</head>
<body>
  <div class="pantalla-como-llegar">
    <header class="encabezado-ruta">
      <button type="button" id="btn-regresar" class="btn-regresar" aria-label="Regresar">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="15 18 9 12 15 6"></polyline>
        </svg>
      </button>
      <h1 class="titulo-ruta">Cómo llegar</h1>
    </header>

    <main class="contenido-ruta">
      <!-- Mapa esquemático del campus -->
      <section class="" aria-label="Mapa de ruta en el campus">
        <svg id="mapa-campus-svg" class="mapa-svg" viewBox="0 0 400 285" role="img" aria-label="Ruta desde Tú hasta Mesa B5 Libre en la Biblioteca">
          <!-- Fondo verde del campus -->
          <rect x="0" y="0" width="400" height="285" fill="#76cf34"></rect>

          <!-- Zonas verdes claras -->
          <polygon points="175,0 400,0 400,285 260,285 235,195 160,150" fill="#8ee33e"></polygon>
          <polygon points="0,190 120,190 155,285 0,285" fill="#82dc38"></polygon>

          <!-- Edificios del campus -->
          <polygon points="105,0 165,0 165,24 145,42 105,22" fill="#f77316" stroke="#4a4a4a" stroke-width="1.2"></polygon>
          <polygon points="348,0 385,0 385,22 362,28 348,14" fill="#f27a54" stroke="#4a4a4a" stroke-width="1.2"></polygon>
          <rect x="232" y="34" width="66" height="44" fill="#ffd633" stroke="#4a4a4a" stroke-width="1.2"></rect>
          <rect x="112" y="46" width="84" height="22" fill="#eab372" stroke="#4a4a4a" stroke-width="1.2"></rect>
          <rect x="20" y="96" width="68" height="24" fill="#e6b06e" stroke="#4a4a4a" stroke-width="1.2"></rect>

          <!-- Edificio Biblioteca (lado derecho) -->
          <polygon points="222,82 288,82 288,116 312,116 312,188 258,188 258,136 222,136" fill="#f2b294" stroke="#4a4a4a" stroke-width="1.2"></polygon>

          <!-- Edificio inferior izquierdo y central -->
          <polygon points="56,162 128,162 128,182 104,182 104,196 56,196" fill="#f2b496" stroke="#4a4a4a" stroke-width="1.2"></polygon>
          <polygon points="148,176 238,176 238,196 184,196 184,218 148,218" fill="#efa888" stroke="#4a4a4a" stroke-width="1.2"></polygon>
          <rect x="256" y="206" width="76" height="28" fill="#ee8459" stroke="#4a4a4a" stroke-width="1.2"></rect>

          <!-- Pequeños bloques / bancas -->
          <rect x="266" y="14" width="8" height="10" fill="#fff7cc" stroke="#555" stroke-width="0.9"></rect>
          <rect x="278" y="14" width="8" height="10" fill="#fff7cc" stroke="#555" stroke-width="0.9"></rect>
          <rect x="290" y="14" width="8" height="10" fill="#fff7cc" stroke="#555" stroke-width="0.9"></rect>

          <rect x="92" y="130" width="8" height="12" fill="#e8c396" stroke="#555" stroke-width="0.9"></rect>
          <rect x="104" y="130" width="8" height="12" fill="#e8c396" stroke="#555" stroke-width="0.9"></rect>

          <!-- Árboles y macetas -->
          <g fill="#2e7d2b" stroke="#235c20" stroke-width="0.8">
            <circle cx="38" cy="14" r="14"></circle>
            <circle cx="72" cy="18" r="10"></circle>
            <circle cx="14" cy="48" r="9"></circle>
            <circle cx="48" cy="52" r="13"></circle>
            <circle cx="88" cy="48" r="8"></circle>
            <circle cx="184" cy="24" r="10"></circle>
            <circle cx="316" cy="28" r="11"></circle>
            <circle cx="388" cy="56" r="13"></circle>
            <circle cx="356" cy="96" r="11"></circle>
            <circle cx="12" cy="136" r="10"></circle>
            <circle cx="44" cy="142" r="9"></circle>
            <circle cx="164" cy="108" r="12"></circle>
            <circle cx="140" cy="134" r="9"></circle>
            <circle cx="36" cy="222" r="16"></circle>
            <circle cx="12" cy="252" r="12"></circle>
            <circle cx="358" cy="238" r="18"></circle>
            <circle cx="386" cy="264" r="12"></circle>
          </g>

          <!-- Macetas circulares -->
          <g>
            <circle cx="102" cy="86" r="6" fill="#d99b66" stroke="#555" stroke-width="0.8"></circle>
            <circle cx="102" cy="86" r="2.2" fill="#e65c5c"></circle>
            <circle cx="122" cy="86" r="6" fill="#d99b66" stroke="#555" stroke-width="0.8"></circle>
            <circle cx="122" cy="86" r="2.2" fill="#e65c5c"></circle>
            <circle cx="28" cy="176" r="6" fill="#d99b66" stroke="#555" stroke-width="0.8"></circle>
            <circle cx="28" cy="176" r="2.2" fill="#e65c5c"></circle>
            <circle cx="48" cy="176" r="6" fill="#d99b66" stroke="#555" stroke-width="0.8"></circle>
            <circle cx="48" cy="176" r="2.2" fill="#e65c5c"></circle>
          </g>

          <!-- Círculos de mobiliario izquierdo -->
          <g fill="#e4ae6b" stroke="#555" stroke-width="0.9">
            <circle cx="24" cy="204" r="7"></circle>
            <circle cx="42" cy="204" r="7"></circle>
            <circle cx="60" cy="204" r="7"></circle>
          </g>

          <!-- Halo y ruta punteada azul -->
          <polyline
            points="126,220 218,220 218,108 228,108"
            fill="none"
            stroke="#c9dcff"
            stroke-width="11"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></polyline>
          <polyline
            id="linea-ruta"
            points="126,220 218,220 218,108 228,108"
            fill="none"
            stroke="#1e5eff"
            stroke-width="5.2"
            stroke-dasharray="7 6"
            stroke-linecap="round"
            stroke-linejoin="round"
          ></polyline>

          <!-- Marcadores de mesas B3 y B4 -->
          <g class="marcador-mesa" data-mesa="B3" data-x="176" data-y="96" style="cursor: pointer;">
            <circle cx="176" cy="96" r="10.5" fill="#187a3b" stroke="#ffffff" stroke-width="2"></circle>
            <text x="176" y="100" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="700">B3</text>
          </g>

          <g class="marcador-mesa" data-mesa="B4" data-x="204" data-y="86" style="cursor: pointer;">
            <circle cx="204" cy="86" r="10.5" fill="#187a3b" stroke="#ffffff" stroke-width="2"></circle>
            <text x="204" y="90" text-anchor="middle" fill="#ffffff" font-size="9.5" font-weight="700">B4</text>
          </g>

          <!-- Marcador destino Mesa B5 -->
          <g class="marcador-mesa" data-mesa="B5" data-x="228" data-y="108" style="cursor: pointer;">
            <circle cx="228" cy="108" r="16" fill="rgba(24, 122, 59, 0.25)"></circle>
            <circle cx="228" cy="108" r="11" fill="#187a3b" stroke="#ffffff" stroke-width="2.2"></circle>
            <text x="228" y="112" text-anchor="middle" fill="#ffffff" font-size="10" font-weight="700">B5</text>
          </g>

          <!-- Etiqueta flotante Mesa B5 · Libre -->
          <g id="badge-mesa-libre" transform="translate(236, 56)">
            <rect x="0" y="0" width="94" height="24" rx="12" fill="#ffffff" stroke="#187a3b" stroke-width="1.6"></rect>
            <text id="texto-badge-mesa" x="47" y="15.5" text-anchor="middle" fill="#152c55" font-size="10" font-weight="700">Mesa B5 · Libre</text>
          </g>

          <!-- Etiqueta y marcador "Tú" -->
          <g transform="translate(108, 178)">
            <rect x="0" y="0" width="36" height="22" rx="6" fill="#0d2a5c"></rect>
            <text x="18" y="14.5" text-anchor="middle" fill="#ffffff" font-size="11" font-weight="700">Tú</text>
          </g>
          <circle cx="126" cy="220" r="14" fill="rgba(30, 94, 255, 0.22)"></circle>
          <circle cx="126" cy="220" r="7.5" fill="#1e5eff" stroke="#ffffff" stroke-width="2.5"></circle>
        </svg>

        <!-- Leyenda inferior del mapa -->
        <div class="leyenda-mapa" aria-label="Leyenda del mapa">
          <span class="item-leyenda">
            <span class="punto-leyenda punto-tu"></span>
            <span>Tú</span>
          </span>
          <span class="item-leyenda">
            <span class="punto-leyenda punto-mesa"></span>
            <span>Mesa libre</span>
          </span>
        </div>
      </section>

      <!-- Información del destino y ruta -->
      <section class="info-destino" aria-label="Detalles de la ruta">
        <h2 id="titulo-destino" class="titulo-destino">Destino: Mesa B5 · Biblioteca</h2>

        <div class="barra-resumen-ruta">
          <span class="etiqueta-esquematica">Ruta esquemática</span>
          <span id="dato-distancia-tiempo" class="dato-distancia-tiempo">≈ 152 m · 2 min a pie</span>
        </div>

        <button type="button" id="btn-toggle-indicaciones" class="btn-indicaciones" aria-expanded="true">
          Ocultar indicaciones
        </button>

        <ol id="lista-indicaciones" class="lista-indicaciones">
          <li>Sal desde tu ubicación, marcada como «Tú».</li>
          <li>Sigue la línea azul del mapa.</li>
          <li id="paso-zona">Llegarás a la zona Biblioteca.</li>
          <li id="paso-mesa">Busca la mesa B5.</li>
        </ol>

        <p class="nota-aproximada">
          La ruta es aproximada. Confirma el camino en el campus.
        </p>
      </section>
    </main>
  </div>

  <script src="../js/como-llegar.js"></script>
</body>
</html>
